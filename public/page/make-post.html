<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asadullah Aman</title>
  <link rel="icon" href="https://i.ibb.co.com/6RP206t0/5813819.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Original+Surfer&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Original+Surfer&display=swap" rel="stylesheet"></noscript>

  <link rel="stylesheet" href="../../style.css" />
  
  <style>
    /* Specific styles for the Post Creation Page */
    .community-section {
      max-width: 800px;
      margin: 0 auto;
      padding: 140px 20px 60px;
      min-height: 100vh;
    }
    .comment-form-container {
      background: var(--bg-card2);
      padding: 32px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .form-row-flex {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }
    .form-row-flex .form-group {
      flex: 1;
      margin-bottom: 0;
    }
    .avatar-upload-label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
    }
    input[type="file"].form-input {
      padding: 10px;
      color: var(--text-secondary);
    }
    
    @media (max-width: 768px) {
      .form-row-flex { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Full Background Animation -->
  <div class="site-bg">
    <div class="village-scene">
      <div class="village-moon"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="village-ground-back"></div>
      <div class="village-ground"></div>
      <div class="village-trees">
        <div class="v-tree tree-1"></div>
        <div class="v-tree tree-2"></div>
        <div class="v-tree tree-3"></div>
      </div>
      <div class="village-tree-right"></div>
      <div class="village-cottage">
        <div class="cottage-roof"></div>
        <div class="cottage-chimney"></div>
        <div class="cottage-smoke"></div>
        <div class="cottage-window"></div>
        <div class="cottage-door"></div>
      </div>
    </div>
    <div class="liquid-glass"></div>
  </div>

  <!-- NAVBAR -->
  <header class="navbar" id="navbar">
    <div class="nav-container">
      <a href="../../index.html#home" class="nav-logo" id="logo-link">
        <div class="logo-icon">
          <img src="https://i.ibb.co.com/6RP206t0/5813819.png" alt="Logo" style="width: 24px; height: 24px; object-fit: contain;">
        </div>
        <div class="logo-text">
          <span class="logo-name">Asadullah Aman</span>
        </div>
      </a>
      
      <div class="nav-links">
        <a href="../../index.html#home" class="nav-link">Home</a>
        <a href="../../index.html#about" class="nav-link">About</a>
        <a href="../../index.html#skills" class="nav-link">Skills</a>
        <a href="../../index.html#portfolio" class="nav-link">Portfolio</a>
        <a href="../../index.html#services" class="nav-link">Services</a>
        <a href="../../index.html#contact" class="nav-link">Contact</a>
        <a href="community.html" class="nav-link" style="color: var(--orange); font-weight: 600;">Community</a>
        <a href="assets.html" class="nav-link">Assets</a>
      </div>

      <input id="checkbox2" type="checkbox">
      <label class="toggle2" for="checkbox2">
        <div id="bar4" class="bars"></div>
        <div id="bar5" class="bars"></div>
        <div id="bar6" class="bars"></div>
      </label>
    </div>
  </header>

  <!-- MOBILE MENU -->
  <div class="glass-radio-group" id="mobile-nav">
    <a href="../../index.html#home" class="glass-nav-link">Home</a>
    <a href="../../index.html#about" class="glass-nav-link">About</a>
    <a href="../../index.html#skills" class="glass-nav-link">Skills</a>
    <a href="../../index.html#portfolio" class="glass-nav-link">Portfolio</a>
    <a href="../../index.html#services" class="glass-nav-link">Services</a>
    <a href="../../index.html#contact" class="glass-nav-link">Contact</a>
    <a href="community.html" class="glass-nav-link" style="color: var(--orange); font-weight: 600;">Community</a>
    <a href="assets.html" class="glass-nav-link">Assets</a>
  </div>

  <main class="community-section">
    <div class="section-header">
      <span class="section-tag">SHARE YOUR THOUGHTS</span>
      <h2 class="section-title">Make a <span class="accent">Post</span></h2>
    </div>

    <!-- POST FORM -->
    <div class="comment-form-container">
      <form id="community-form">
        <div class="form-row-flex">
          <div class="form-group">
            <label for="c-name" class="form-label" style="display:none;">Name</label>
            <input type="text" id="c-name" class="form-input" placeholder="Your Name" required />
          </div>
          <div class="form-group">
            <label for="c-email" class="form-label" style="display:none;">Email</label>
            <input type="email" id="c-email" class="form-input" placeholder="Email Address" required />
          </div>
        </div>
        
        <div class="form-group" style="margin-bottom: 16px;">
          <label for="c-avatar" class="avatar-upload-label">Profile Photo (Optional)</label>
          <input type="file" id="c-avatar" class="form-input" accept="image/png, image/jpeg, image/webp" />
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label for="c-comment" class="form-label" style="display:none;">Comment</label>
          <textarea id="c-comment" class="form-input" placeholder="What's on your mind?" rows="4" required></textarea>
        </div>
        <button type="submit" class="toggle" id="btn-submit-comment" style="width: 100%; border: none; background: transparent; padding: 0;"><span class="button"></span><span class="label">POST COMMENT</span></button>
      </form>
    </div>
  </main>

  <!-- FOOTER -->
  <footer style="width:100%;padding:24px 32px;background:rgba(5,5,5,0.95);border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;font-family:'Inter',sans-serif;font-size:13px;color:rgba(255,255,255,0.4);box-sizing:border-box;">
    <span>&copy; <span id="footer-year"></span> <strong style="color:rgba(255,255,255,0.7);">Asadullah Aman</strong>. All rights reserved.</span>
    <span>Built with <a href="https://unfilteredpages.vercel.app/public/pages/sites" target="_blank" rel="noopener noreferrer" style="color:#F57C00;text-decoration:none;font-weight:600;transition:color 0.2s ease;" onmouseover="this.style.color='#FF9A44'" onmouseout="this.style.color='#F57C00'">&#10022; Silky Web</a></span>
  </footer>
  <script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>

  <script src="../js/supabase-client.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('community-form');
      const submitBtn = document.getElementById('btn-submit-comment');
      const btnLabel = submitBtn.querySelector('.label') || submitBtn;
      const avatarInput = document.getElementById('c-avatar');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('c-name').value.trim();
        const email = document.getElementById('c-email').value.trim();
        const comment = document.getElementById('c-comment').value.trim();

        if (!name || !email || !comment) return;

        submitBtn.disabled = true;
        let finalAvatarUrl = null;

        try {
          if (avatarInput.files.length > 0) {
            btnLabel.textContent = 'UPLOADING PHOTO...';
            finalAvatarUrl = await window.uploadToImgBB(avatarInput.files[0]);
          }

          btnLabel.textContent = 'POSTING COMMENT...';

          await window.supabase.insert('community', { 
            name: name, 
            email: email, 
            comment: comment,
            avatar_url: finalAvatarUrl 
          });
          
          form.reset();
          btnLabel.textContent = 'POSTED! ✓';
          
          // Redirect to the community feed after posting
          setTimeout(() => {
            window.location.href = "community.html";
          }, 1500);
          
        } catch (err) {
          console.error('Error posting comment:', err);
          btnLabel.textContent = 'ERROR POSTING';
          
          setTimeout(() => {
            btnLabel.textContent = 'POST COMMENT';
            submitBtn.disabled = false;
          }, 2500);
        }
      });

      const toggleCheckbox = document.getElementById('checkbox2');
      const mobileNav = document.getElementById('mobile-nav');
      if (toggleCheckbox && mobileNav) {
        toggleCheckbox.addEventListener('change', (e) => {
          mobileNav.classList.toggle('open', e.target.checked);
        });

        document.addEventListener('click', (e) => {
          if (!mobileNav.contains(e.target) && !toggleCheckbox.contains(e.target) && !e.target.closest('label[for="checkbox2"]')) {
            toggleCheckbox.checked = false;
            mobileNav.classList.remove('open');
          }
        });

        mobileNav.querySelectorAll('.glass-nav-link').forEach(link => {
          link.addEventListener('click', () => {
            toggleCheckbox.checked = false;
            mobileNav.classList.remove('open');
          });
        });
      }
    });
  </script>
</body>
</html>
