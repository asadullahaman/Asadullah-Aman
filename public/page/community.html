<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Feed — Asadullah Aman</title>
  <link rel="stylesheet" href="../../style.css" />
  
  <style>
    /* Specific styles for the Community Feed Page */
    .community-section {
      max-width: 800px;
      margin: 0 auto;
      padding: 140px 20px 60px;
      min-height: 100vh;
    }
    
    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .comment-card {
      background: var(--bg-card);
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 20px;
      transition: transform var(--transition);
      display: flex;
      gap: 18px;
    }
    .comment-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.15);
    }
    
    .comment-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      background: var(--bg-card2);
      flex-shrink: 0;
    }
    
    .comment-content {
      flex: 1;
    }
    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 8px;
    }
    .comment-name {
      font-weight: 700;
      color: var(--orange);
      font-size: 16px;
    }
    .comment-date {
      font-size: 12px;
      color: var(--text-dim);
    }
    .comment-body {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    
    @media (max-width: 768px) {
      .comment-card { flex-direction: column; gap: 12px; }
      .comment-avatar { width: 40px; height: 40px; }
      .feed-header { flex-direction: column; gap: 20px; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- STARFIELD BACKGROUND -->
  <div class="container fixed-bg">
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>
  </div>

  <!-- NAVBAR -->
  <header class="navbar" id="navbar">
    <div class="nav-container">
      <a href="../../index.html" class="nav-logo" id="logo-link">
        <div class="logo-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        </div>
        <div class="logo-text">
          <span class="logo-name">Asadullah Aman</span>
          <span class="logo-subtitle">Video Editor</span>
        </div>
      </a>
      
      <div class="nav-links">
        <a href="../../index.html" class="nav-link">Home</a>
        <a href="../../index.html#portfolio" class="nav-link">Portfolio</a>
        <a href="community.html" class="nav-link" style="color: #fff; background: rgba(255,255,255,0.05);">Community</a>
      </div>

      <input id="checkbox2" type="checkbox">
      <label class="toggle toggle2" for="checkbox2">
        <div id="bar4" class="bars"></div>
        <div id="bar5" class="bars"></div>
        <div id="bar6" class="bars"></div>
      </label>
    </div>
  </header>

  <!-- MOBILE MENU -->
  <div class="glass-radio-group" id="mobile-nav">
    <a href="../../index.html" class="glass-nav-link">Home</a>
    <a href="../../index.html#portfolio" class="glass-nav-link">Portfolio</a>
    <a href="community.html" class="glass-nav-link">Community</a>
  </div>
  
  <!-- DRAGGABLE GLASS CLOCK (PiP) -->
  <div class="glass-clock-widget" id="draggable-clock">
    <div class="clock-time" id="clock-time">00:00</div>
    <div class="clock-date" id="clock-date">Loading...</div>
  </div>

  <main class="community-section">
    <div class="feed-header">
      <div>
        <span class="section-tag">JOIN THE DISCUSSION</span>
        <h2 class="section-title">Community <span class="accent">Board</span></h2>
      </div>
      <!-- Button linking to the creation page -->
      <a href="make-post.html" class="btn-primary" style="text-decoration: none;">+ NEW POST</a>
    </div>

    <!-- COMMENTS DISPLAY AREA -->
    <div id="comments-list">
      <p style="text-align:center; color:var(--text-dim);">Loading community posts...</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p>&copy; 2026 Asadullah Aman. All rights reserved.</p>
      <p class="developer-credit">
        Designed & Developed with <span class="glow-dot"></span> by <a href="../../index.html" class="dev-name">Asadullah Aman</a>
      </p>
    </div>
  </footer>

  <script src="../js/supabase-client.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const commentsList = document.getElementById('comments-list');

      async function loadComments() {
        try {
          const data = await window.supabase.select('community', { order: 'created_at.desc' });
          
          if (!data || data.length === 0) {
            commentsList.innerHTML = '<p style="text-align:center; color:var(--text-dim);">No posts yet. Be the first to start the discussion!</p>';
            return;
          }

          commentsList.innerHTML = ''; 
          
          data.forEach(item => {
            const dateObj = new Date(item.created_at);
            const formattedDate = dateObj.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
            
            const safeAvatar = item.avatar_url 
              ? escapeHTML(item.avatar_url) 
              : `https://ui-avatars.com/api/?name=${encodeURIComponent(item.name)}&background=29b6f6&color=fff&bold=true`;

            const card = document.createElement('div');
            card.className = 'comment-card';
            card.innerHTML = `
              <img src="${safeAvatar}" alt="${escapeHTML(item.name)}" class="comment-avatar" loading="lazy" />
              <div class="comment-content">
                <div class="comment-header">
                  <span class="comment-name">${escapeHTML(item.name)}</span>
                  <span class="comment-date">${formattedDate}</span>
                </div>
                <div class="comment-body">${escapeHTML(item.comment)}</div>
              </div>
            `;
            commentsList.appendChild(card);
          });
        } catch (err) {
          console.error('Error loading posts:', err);
          commentsList.innerHTML = '<p style="text-align:center; color:#e53935;">Failed to load posts from database.</p>';
        }
      }

      function escapeHTML(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      const toggleCheckbox = document.getElementById('checkbox2');
      const mobileNav = document.getElementById('mobile-nav');
      if (toggleCheckbox && mobileNav) {
        toggleCheckbox.addEventListener('change', (e) => {
          if (e.target.checked) mobileNav.classList.add('open');
          else mobileNav.classList.remove('open');
        });
      }

      loadComments();
    });
  </script>
</body>
</html>
