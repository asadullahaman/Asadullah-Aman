  <style>
    /* Specific styles for the Community Feed Page */
    .community-section {
      max-width: 800px;
      margin: 0 auto;
      padding: 140px 20px 60px;
      min-height: 100vh;
    }
    
    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .comment-card {
      background: var(--bg-card);
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 20px;
      transition: transform var(--transition);
      display: flex;
      gap: 18px;
    }
    .comment-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.15);
    }
    
    .comment-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      background: var(--bg-card2);
      flex-shrink: 0;
    }
    
    .comment-content {
      flex: 1;
    }
    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 8px;
    }
    .comment-name {
      font-weight: 700;
      color: var(--orange);
      font-size: 16px;
    }
    .comment-date {
      font-size: 12px;
      color: var(--text-dim);
    }
    .comment-body {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    
    /* =========================================
       DRAGGABLE GLASS CLOCK WIDGET CSS
       ========================================= */
    .glass-clock-widget {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 9999;
      cursor: grab;
      user-select: none;
      
      /* Transparent container */
      background: transparent;
      border: none;
      padding: 20px;
      text-align: center;
      transition: transform 0.2s ease;
      touch-action: none; 
    }

    .glass-clock-widget:active {
      cursor: grabbing;
      transform: scale(0.98);
    }

    .clock-time {
      font-family: 'Inter', sans-serif;
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 2px;
      
      /* Liquid Glass Text Effect */
      color: rgba(255, 255, 255, 0.05); 
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.8); 
      text-shadow: 0 10px 20px rgba(0, 0, 0, 0.5); 
    }

    .clock-date {
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-top: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    @media (max-width: 768px) {
      .comment-card { flex-direction: column; gap: 12px; }
      .comment-avatar { width: 40px; height: 40px; }
      .feed-header { flex-direction: column; gap: 20px; text-align: center; }
      
      .glass-clock-widget {
        bottom: 20px;
        right: 20px;
        padding: 10px;
      }
      .clock-time {
        font-size: 3rem;
      }
      .clock-date {
        font-size: 0.75rem;
      }
    }
  </style>
</head>

    <span>Built with <a href="https://unfilteredpages.vercel.app/public/pages/sites" target="_blank" rel="noopener noreferrer" style="color:#F57C00;text-decoration:none;font-weight:600;transition:color 0.2s ease;" onmouseover="this.style.color='#FF9A44'" onmouseout="this.style.color='#F57C00'">&#10022; Silky Web</a></span>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      
      // ==========================================
      // 1. DRAGGABLE GLASS CLOCK & DATE LOGIC
      // ==========================================
      const clockWidget = document.getElementById('draggable-clock');
      const timeEl = document.getElementById('clock-time');
      const dateEl = document.getElementById('clock-date');

      if (clockWidget && timeEl && dateEl) {
        function updateClock() {
          const now = new Date();
          let hours = now.getHours();
          let minutes = now.getMinutes();
          
          hours = hours % 12;
          hours = hours ? hours : 12; 
          minutes = minutes < 10 ? '0' + minutes : minutes;
          
          timeEl.textContent = `${hours}:${minutes}`;
          
          const options = { weekday: 'long', month: 'short', day: 'numeric' };
          dateEl.textContent = now.toLocaleDateString('en-US', options);
        }
        
        setInterval(updateClock, 1000);
        updateClock(); 

        let isDragging = false;
        let initialX, initialY;

        function dragStart(e) {
          if (e.target.closest('.glass-clock-widget')) {
            isDragging = true;
            
            const rect = clockWidget.getBoundingClientRect();
            const clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
            
            initialX = clientX - rect.left;
            initialY = clientY - rect.top;
            
            clockWidget.style.bottom = 'auto';
            clockWidget.style.right = 'auto';
            clockWidget.style.width = rect.width + 'px'; 
          }
        }

        function dragEnd() {
          isDragging = false;
        }

        function drag(e) {
          if (isDragging) {
            e.preventDefault(); 
            
            const clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;

            let newX = clientX - initialX;
            let newY = clientY - initialY;

            const maxX = window.innerWidth - clockWidget.offsetWidth;
            const maxY = window.innerHeight - clockWidget.offsetHeight;

            if (newX < 0) newX = 0;
            if (newY < 0) newY = 0;
            if (newX > maxX) newX = maxX;
            if (newY > maxY) newY = maxY;

            clockWidget.style.left = `${newX}px`;
            clockWidget.style.top = `${newY}px`;
          }
        }

        clockWidget.addEventListener("mousedown", dragStart);
        document.addEventListener("mousemove", drag);
        document.addEventListener("mouseup", dragEnd);

        clockWidget.addEventListener("touchstart", dragStart, { passive: false });
        document.addEventListener("touchmove", drag, { passive: false });
        document.addEventListener("touchend", dragEnd);
      }

      // ==========================================
      // 2. SUPABASE COMMENTS LOGIC
      // ==========================================
      const commentsList = document.getElementById('comments-list');

      async function loadComments() {
        try {
          const data = await window.supabase.select('community', { order: 'created_at.desc' });
          
          if (!data || data.length === 0) {
            commentsList.innerHTML = '<p style="text-align:center; color:var(--text-dim);">No posts yet. Be the first to start the discussion!</p>';
            return;
          }

          commentsList.innerHTML = ''; 
          
          data.forEach(item => {
            const dateObj = new Date(item.created_at);
            const formattedDate = dateObj.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
            
            const safeAvatar = item.avatar_url 
              ? escapeHTML(item.avatar_url) 
              : `https://ui-avatars.com/api/?name=${encodeURIComponent(item.name)}&background=29b6f6&color=fff&bold=true`;

            const card = document.createElement('div');
            card.className = 'comment-card';
            card.innerHTML = `
              <img src="${safeAvatar}" alt="${escapeHTML(item.name)}" class="comment-avatar" loading="lazy" />
              <div class="comment-content">
                <div class="comment-header">
                  <span class="comment-name">${escapeHTML(item.name)}</span>
                  <span class="comment-date">${formattedDate}</span>
                </div>
                <div class="comment-body">${escapeHTML(item.comment)}</div>
              </div>
            `;
            commentsList.appendChild(card);
          });
        } catch (err) {
          console.error('Error loading posts:', err);
          commentsList.innerHTML = '<p style="text-align:center; color:#e53935;">Failed to load posts from database.</p>';
        }
      }

      function escapeHTML(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // Mobile Menu Toggle
      const toggleCheckbox = document.getElementById('checkbox2');
      const mobileNav = document.getElementById('mobile-nav');
      if (toggleCheckbox && mobileNav) {
        toggleCheckbox.addEventListener('change', (e) => {
          mobileNav.classList.toggle('open', e.target.checked);
        });

        document.addEventListener('click', (e) => {
          if (!mobileNav.contains(e.target) && !toggleCheckbox.contains(e.target) && !e.target.closest('label[for="checkbox2"]')) {
            toggleCheckbox.checked = false;
            mobileNav.classList.remove('open');
          }
        });

        mobileNav.querySelectorAll('.glass-nav-link').forEach(link => {
          link.addEventListener('click', () => {
            toggleCheckbox.checked = false;
            mobileNav.classList.remove('open');
          });
        });
      }

      loadComments();
    });
  </script>
